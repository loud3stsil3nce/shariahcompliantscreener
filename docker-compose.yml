services:
  shariahscreener-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shariahscreener_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8001"
    env_file:
      - .env
    volumes:
      - .:/app

  shariahscreener-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shariahscreener_ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      - BACKEND_URL=http://shariahscreener-api:8001
    depends_on:
      - shariahscreener-api